<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13151a">
  <title>Page not found | Alex Sekunau</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --ink: #13151a; --cream: #f7ebc9; --yellow: #ffda77; --pink: #ef579b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--ink);
      color: var(--cream);
      font: 16px/1.6 "DM Sans", Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 620px; }
    p { color: #c1bcb0; }
    .eyebrow { margin: 0 0 18px; color: var(--pink); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 18px; font-family: "Arial Narrow", Impact, sans-serif; font-weight: 400; font-size: clamp(64px, 16vw, 140px); line-height: .92; letter-spacing: -.02em; text-transform: uppercase; }
    a { display: inline-block; margin-top: 26px; padding: 15px 22px; background: var(--yellow); color: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-decoration: none; text-transform: uppercase; box-shadow: 4px 5px 0 var(--cream); }
    a:hover { background: #ffe6a6; }
    :focus-visible { outline: 3px solid var(--cream); outline-offset: 5px; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">404 · Lost on Sunset Blvd.</p>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a href="./">Back to the portfolio</a>
</main>
</body>
</html>
